<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | StockPro Inventory System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden antialiased">

    <!-- Atmospheric background gradients -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/25 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo and Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-600 text-white shadow-xl shadow-indigo-500/30 mb-4">
                <i class="fa-solid fa-boxes-stacked text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">StockPro Inventory</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to access your stock management dashboard</p>
        </div>

        <!-- Notification messages -->
        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="p-3.5 rounded-xl text-sm font-medium border flex items-center gap-3
                {% if message.tags == 'error' %}bg-rose-950/60 border-rose-800 text-rose-300
                {% elif message.tags == 'info' %}bg-blue-950/60 border-blue-800 text-blue-300
                {% else %}bg-emerald-950/60 border-emerald-800 text-emerald-300{% endif %}">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Login Card -->
        <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl">
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="id_username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-regular fa-user text-sm"></i>
                        </span>
                        <input type="text" name="username" id="id_username" required autofocus
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                            placeholder="Enter username">
                    </div>
                </div>

                <div>
                    <label for="id_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" id="id_password" required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500">
                        <span>Remember me</span>
                    </label>
                    <span class="text-indigo-400 font-medium">Django & MySQL Auth</span>
                </div>

                <button type="submit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all flex items-center justify-center gap-2">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Demo Credentials Helper -->
            <div class="mt-8 pt-6 border-t border-slate-700/60">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Demo Credentials</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400">Ready to test</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillCreds('admin', 'admin123')" class="p-2.5 rounded-xl bg-slate-900/60 border border-slate-700 hover:border-indigo-500 text-left transition-all group">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-indigo-400 group-hover:text-indigo-300">Admin</span>
                            <i class="fa-solid fa-crown text-[10px] text-amber-400"></i>
                        </div>
                        <p class="text-slate-400 text-[11px] mt-0.5">admin / admin123</p>
                        <p class="text-[10px] text-slate-500 mt-1">Full control & delete</p>
                    </button>
                    <button type="button" onclick="fillCreds('staff', 'staff123')" class="p-2.5 rounded-xl bg-slate-900/60 border border-slate-700 hover:border-indigo-500 text-left transition-all group">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-emerald-400 group-hover:text-emerald-300">Staff</span>
                            <i class="fa-solid fa-user text-[10px] text-emerald-400"></i>
                        </div>
                        <p class="text-slate-400 text-[11px] mt-0.5">staff / staff123</p>
                        <p class="text-[10px] text-slate-500 mt-1">Stock in/out & view</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('id_username').value = u;
            document.getElementById('id_password').value = p;
        }
    </script>
</body>
</html>
